<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" id="brand-link" aria-label="Tabo dashboard">
        <span class="brand-symbol" aria-hidden="true">t<span class="brand-dot">.</span></span>
        <span class="brand-name">tabo</span>
      </a>
      <div class="workspace-label" id="workspace-label">PLATFORM WORKSPACE</div>
      <nav class="side-nav" id="side-nav" aria-label="Workspace navigation"></nav>
      <div class="sidebar-bottom">
        <div class="sidebar-note"><span class="sidebar-note-icon" id="sidebar-note-icon"></span><div><strong>Shop-managed fulfillment</strong><span>No drivers or online payments are managed by Tabo.</span></div></div>
        <div class="demo-caption">Interactive prototype · Demo data</div>
      </div>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <div class="top-left">
          <div class="mobile-logo">tabo</div>
          <div class="crumb" id="breadcrumb">Overview</div>
        </div>
        <div class="top-right">
          <span class="demo-pill">DEMO</span>
          <div class="role-select-wrap">
            <label class="sr-only" for="role-switch">Workspace</label>
            <select id="role-switch" aria-label="Choose workspace"><option value="seller">Seller workspace</option><option value="admin">Admin workspace</option></select>
            <span id="role-chevron" aria-hidden="true"></span>
          </div>
          <span class="avatar" id="user-avatar">TP</span>
        </div>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
      <footer class="page-footer">Tabo prototype · Local browser demo · Orders and shop management only</footer>
    </div>
    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>
  <div class="toast-area" id="toast-area" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><h2 id="modal-title">Menu item</h2><button class="icon-button" id="close-modal" aria-label="Close dialog"></button></div>
      <form id="item-form">
        <input type="hidden" name="id" id="item-id">
        <div class="form-row"><label for="item-name">Item name</label><input id="item-name" name="name" maxlength="70" placeholder="e.g. Margherita Pizza" required></div>
        <div class="two-fields">
          <div class="form-row"><label for="item-price">Price (₱)</label><input id="item-price" name="price" type="number" min="1" max="50000" step="1" required></div>
          <div class="form-row"><label for="item-cat">Category</label><select id="item-cat" name="category"><option>Pizza</option><option>Burgers</option><option>Filipino</option><option>Sides</option><option>Drinks</option><option>Desserts</option></select></div>
        </div>
        <div class="form-row"><label for="item-desc">Short description</label><textarea id="item-desc" rows="3" maxlength="180" placeholder="What makes this item worth ordering?"></textarea></div>
        <div class="form-row"><label for="item-image">Image URL <span class="optional">(optional)</span></label><input id="item-image" type="url" placeholder="https://..."></div>
        <div class="modal-foot"><button type="button" class="btn btn-quiet" id="cancel-modal">Cancel</button><button class="btn btn-primary" type="submit" id="submit-item">Save item</button></div>
      </form>
    </div>
  </div>
  <script>
/* Tabo: standalone admin / seller prototype. All data stays in this browser. */

  function shopsPage(){const shops=state.shops.filter(s=>(shopFilter==='all'||s.status===shopFilter)&&(!search||[s.name,s.category,s.description].join(' ').toLowerCase().includes(search.toLowerCase())));return header('Shop management','Review applications and control which shops appear on Tabo.')+`<div class="toolbar"><div class="tabs">${[['all','All shops'],['pending','Pending'],['active','Active'],['suspended','Suspended'],['rejected','Rejected']].map(([id,label])=>`<button class="tab ${shopFilter===id?'selected':''}" data-action="shop-filter" data-filter="${id}">${label}</button>`).join('')}</div><label class="search-field">${icon('search')}<input id="search-shops" placeholder="Search shops" value="${esc(search)}" autocomplete="off" aria-label="Search shops"></label></div>${shops.length?`<div class="shop-grid">${shops.map(s=>`<article class="surface shop-card"><img class="shop-photo" src="${esc(s.image)}" alt="${esc(s.name)}" loading="lazy"><div class="shop-contents"><h3>${esc(s.name)}</h3><p>${esc(s.category)}</p><div class="badges">${badge(s.status)}${s.status==='active'?(s.pickup?`<span class="badge">Pickup</span>`:'')+(s.delivery?`<span class="badge">Shop delivery</span>`:''):''}</div><div class="shop-actions">${s.status==='pending'?`${button('Approve','shop-status',`data-id="${s.id}" data-value="active"`,'btn-primary','check')}${button('Reject','shop-status',`data-id="${s.id}" data-value="rejected"`,'btn-danger','close')}`:s.status==='active'?button('Suspend','shop-status',`data-id="${s.id}" data-value="suspended"`,'btn-quiet','close'):s.status==='suspended'?button('Reactivate','shop-status',`data-id="${s.id}" data-value="active"`,'btn-primary','check'):button('Reconsider','shop-status',`data-id="${s.id}" data-value="pending"`,'btn-quiet','refresh')}</div></div></article>`).join('')}</div>`:emptyBlock('No shops found','Try a different status or search.')}`;}
  function menuPage(){const all=role==='admin'?state.menu:state.menu.filter(m=>m.shopId==='tony');const shown=all.filter(m=>(menuFilter==='all'||(menuFilter==='available'?m.available:menuFilter==='unavailable'?!m.available:m.category===menuFilter))&&(!search||[m.name,m.category,shopOf(m.shopId)?.name||''].join(' ').toLowerCase().includes(search.toLowerCase())));return header(role==='admin'?'Menu catalog':'Menu management',role==='admin'?'Browse listed items. Each shop owns its menu and availability.':'Add items, change prices, or mark dishes sold out.',role==='seller'?button('Add menu item','open-item','','btn-primary','plus'):'')+`<div class="toolbar"><div class="tabs">${[['all','All items'],['available','Available'],['unavailable','Sold out']].map(([id,label])=>`<button class="tab ${menuFilter===id?'selected':''}" data-action="menu-filter" data-filter="${id}">${label}</button>`).join('')}</div><label class="search-field">${icon('search')}<input id="search-menu" placeholder="Search menu" value="${esc(search)}" autocomplete="off" aria-label="Search menu"></label></div>${shown.length?`<div class="menu-grid">${shown.map(m=>`<article class="surface menu-card"><img src="${esc(m.image)}" alt="${esc(m.name)}" loading="lazy" onerror="this.onerror=null;this.src='${PHOTO.pizza}'"><div class="menu-info"><h3>${esc(m.name)}</h3><div class="desc">${role==='admin'?esc(shopOf(m.shopId)?.name||'Shop')+' · ':''}${esc(m.description||m.category)}</div><div class="menu-price">${peso(m.price)}</div><div class="menu-foot">${m.available?badge('active'):`<span class="badge red">Sold out</span>`}${role==='seller'?`<div class="stat-row">${button('Edit','open-item',`data-id="${m.id}"`,'btn-small','edit')}${button(m.available?'Hide':'Show','menu-toggle',`data-id="${m.id}"`,'btn-small',m.available?'close':'check')}</div>`:''}</div></div></article>`).join('')}</div>`:emptyBlock('No menu items found','Try another filter or add an item.')}`;}
  function shopSettings(){const s=sellerShop();return header('Shop settings','Set what your shop offers. Tabo does not assign riders or handle payments.')+`<div class="settings-grid"><section class="surface panel"><div class="panel-head"><h2>Fulfillment & availability</h2></div><div class="field-group"><div class="choice-row"><div><strong>Accepting orders</strong><span class="help">Temporarily close or open the shop.</span></div><button class="switch" role="switch" aria-checked="${s.open}" aria-label="Accepting orders" data-action="shop-toggle" data-field="open" ${s.status!=='active'?'disabled':''}></button></div><div class="choice-row"><div><strong>Customer pickup</strong><span class="help">Customers collect orders from your shop.</span></div><button class="switch" role="switch" aria-checked="${s.pickup}" aria-label="Customer pickup" data-action="shop-toggle" data-field="pickup"></button></div><div class="choice-row"><div><strong>Shop delivery</strong><span class="help">Your shop arranges and completes delivery.</span></div><button class="switch" role="switch" aria-checked="${s.delivery}" aria-label="Shop delivery" data-action="shop-toggle" data-field="delivery"></button></div></div><div class="field-group"><h3>Shop delivery fee</h3><p>Shown at checkout only when shop delivery is enabled.</p><div class="form-row" style="max-width:200px;margin-bottom:0"><label for="delivery-fee">Fee (₱)</label><input id="delivery-fee" type="number" min="0" max="10000" step="1" value="${s.fee}" ${!s.delivery?'disabled':''}></div></div><div class="field-group"><h3>Preparation estimate</h3><p>This is shown to customers as an estimate set by your shop.</p><div class="form-row" style="max-width:260px;margin-bottom:0"><label for="prep-estimate">Time estimate</label><select id="prep-estimate">${['10–15 min','15–25 min','20–30 min','25–35 min','30–45 min','45–60 min'].map(v=>`<option ${s.estimate===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div style="margin-top:17px">${button('Save fulfillment settings','save-settings','','btn-primary','check')}</div></section><div class="list-stack"><section class="surface panel"><div class="panel-head"><h2>Store information</h2></div><div class="form-row"><label for="shop-name">Shop name</label><input id="shop-name" maxlength="60" value="${esc(s.name)}"></div><div class="form-row"><label for="shop-phone">Contact number</label><input id="shop-phone" maxlength="24" value="${esc(s.phone)}"></div><div class="form-row"><label for="shop-hours">Operating hours</label><input id="shop-hours" maxlength="50" value="${esc(s.hours)}"></div><div class="form-row"><label for="shop-description">Description</label><textarea id="shop-description" rows="3" maxlength="240">${esc(s.description)}</textarea></div>${button('Save store information','save-profile','','btn-primary','check')}</section><section class="soft-message"><strong>Shop-controlled order fulfillment</strong><br>For pickup, customers collect the food. For delivery, your shop arranges transport. Customers pay the shop directly.</section></div></div>`;}
  function platformSettings(){return header('Platform settings','Simple controls for a lightweight marketplace demo.')+`<div class="settings-grid"><section class="surface panel"><h2>Operating model</h2><p class="setting-subtitle">These are fixed decisions for this prototype.</p><div class="choice-row"><div><strong>Platform role</strong><span class="help">Connect customers with registered local shops</span></div>${badge('active')}</div><div class="choice-row"><div><strong>Pickup & delivery</strong><span class="help">Each shop selects what it offers</span></div>${badge('active')}</div><div class="choice-row"><div><strong>Rider dispatch</strong><span class="help">Not provided by the platform</span></div><span class="badge">Not included</span></div><div class="choice-row"><div><strong>Online payments</strong><span class="help">Customers pay the shop directly</span></div><span class="badge">Not included</span></div></section><div class="list-stack"><section class="surface panel"><h2>Prototype controls</h2><p class="mini-note" style="margin:8px 0 14px">Changes made here are browser-only. Nothing is sent to sellers or customers.</p>${button('Reset all demo data','reset-demo','','btn-danger','refresh')}</section><div class="soft-message"><strong>What an admin can do</strong><br>Approve shops, suspend or reactivate shops, view orders and view menu catalog. Admins cannot fulfill orders on behalf of sellers.</div></div></div>`;}
  function render(){const roleSel=$('role-switch');roleSel.value=role;$('role-chevron').innerHTML=icon('chevron');$('user-avatar').textContent=role==='admin'?'TA':'TP';$('workspace-label').textContent=role==='admin'?'ADMIN WORKSPACE':'SELLER WORKSPACE';$('sidebar-note-icon').innerHTML=icon('info');$('close-modal').innerHTML=icon('close');const names={overview:'Overview',orders:'Orders',shops:'Shop management',menu:role==='admin'?'Menu catalog':'My menu',settings:role==='admin'?'Platform settings':'Shop settings'};$('breadcrumb').textContent=names[page];nav();let html='';if(page==='overview')html=role==='admin'?adminOverview():sellerOverview();else if(page==='orders')html=ordersPage();else if(page==='shops')html=shopsPage();else if(page==='menu')html=menuPage();else if(page==='settings')html=role==='admin'?platformSettings():shopSettings();$('content').innerHTML=html;}
  function updateOrder(id,next){const o=state.orders.find(x=>x.id===id);if(!o||o.shopId!=='tony'||role!=='seller')return;const allowed={new:['accepted','rejected'],accepted:['preparing'],preparing:[o.fulfillment==='pickup'?'ready':'on_the_way'],ready:['completed'],on_the_way:['completed']}[o.status]||[];if(!allowed.includes(next))return toast('This order cannot move to that status.',true);o.status=next;save();render();toast(`${o.id}: ${statusLabel[next]}.`);}
  function updateShop(id,next){if(role!=='admin')return;const s=shopOf(id);if(!s)return;const transitions={pending:['active','rejected'],active:['suspended'],suspended:['active'],rejected:['pending']};if(!transitions[s.status]?.includes(next))return toast('This shop status cannot be changed that way.',true);s.status=next;if(next!=='active')s.open=false;else s.open=true;save();render();toast(`${s.name}: ${statusLabel[next]||next}.`);}
  function addOrder(){if(role!=='seller')return;const s=sellerShop();if(!s.open||s.status!=='active')return toast('Open your approved shop before receiving orders.',true);const fulfillment=s.pickup?'pickup':s.delivery?'delivery':null;if(!fulfillment)return toast('Enable pickup or delivery in settings first.',true);const first=state.menu.find(m=>m.shopId==='tony'&&m.available);if(!first)return toast('Make at least one menu item available.',true);const id='TB-'+state.nextId++;state.orders.unshift({id,shopId:'tony',customer:'Demo Customer',phone:'0917 000 0000',fulfillment,status:'new',time:'Just now',lines:[[first.name,1,first.price]]});save();navigate('orders');toast(`${id} added to your order queue.`);}
  function toggleSetting(field){if(role!=='seller'||!['open','pickup','delivery'].includes(field))return;const s=sellerShop();if(field==='open'&&s.status!=='active')return toast('Only approved shops can accept orders.',true);if(field!=='open'&&s[field]&&(field==='pickup'?!s.delivery:!s.pickup))return toast('Keep at least one fulfillment method enabled.',true);s[field]=!s[field];save();render();toast(`${field==='open'?'Accepting orders':field==='pickup'?'Customer pickup':'Shop delivery'} ${s[field]?'enabled':'disabled'}.`);}
  function saveSettings(){const s=sellerShop();const fee=Number($('delivery-fee')?.value||0);const time=$('prep-estimate')?.value||'';if(!Number.isInteger(fee)||fee<0||fee>10000)return toast('Enter a delivery fee between ₱0 and ₱10,000.',true);s.fee=fee;s.estimate=time;save();render();toast('Fulfillment settings saved.');}
  function saveProfile(){const s=sellerShop(),name=$('shop-name').value.trim(),phone=$('shop-phone').value.trim(),hours=$('shop-hours').value.trim(),description=$('shop-description').value.trim();if(name.length<2||!phone||!hours)return toast('Enter a shop name, phone number and hours.',true);Object.assign(s,{name,phone,hours,description});save();render();toast('Store information saved.');}
  function openItem(id){if(role!=='seller')return;const m=id?state.menu.find(x=>x.id===id&&x.shopId==='tony'):null;$('modal-title').textContent=m?'Edit menu item':'Add menu item';$('item-id').value=m?.id||'';$('item-name').value=m?.name||'';$('item-price').value=m?.price||'';$('item-cat').value=m?.category||'Pizza';$('item-desc').value=m?.description||'';$('item-image').value=m?.image||'';$('modal-backdrop').hidden=false;document.body.style.overflow='hidden';$('item-name').focus();}
  function closeModal(){$('modal-backdrop').hidden=true;document.body.style.overflow='';}
  function submitItem(event){event.preventDefault();if(role!=='seller')return;const id=$('item-id').value,name=$('item-name').value.trim(),price=Number($('item-price').value),category=$('item-cat').value,description=$('item-desc').value.trim(),image=$('item-image').value.trim();if(name.length<2||!Number.isInteger(price)||price<1||price>50000)return toast('Enter a valid item name and price.',true);if(image&&!/^https?:\/\//i.test(image))return toast('Image URL must begin with https:// or http://.',true);if(id){const m=state.menu.find(x=>x.id===id&&x.shopId==='tony');if(!m)return;m.name=name;m.price=price;m.category=category;m.description=description;m.image=image||m.image;}else{state.menu.unshift({id:'m'+Date.now(),shopId:'tony',name,price,category,description,image:image||PHOTO.pizza,available:true});}save();closeModal();render();toast(id?'Menu item updated.':'Menu item added.');}
  function toggleMenu(id){const m=state.menu.find(x=>x.id===id&&x.shopId==='tony');if(role!=='seller'||!m)return;m.available=!m.available;save();render();toast(`${m.name} marked ${m.available?'available':'sold out'}.`);}
  function resetDemo(){if(role!=='admin')return;if(!window.confirm('Reset all shops, orders and menu items to the original demo data?'))return;state=copy(INITIAL);save();navigate('overview');toast('Demo data reset.');}
  function bind(){ $('brand-link').addEventListener('click',e=>{e.preventDefault();navigate('overview');});$('role-switch').addEventListener('change',e=>{role=e.target.value;page='overview';search='';render();toast(`${role==='admin'?'Admin':'Seller'} workspace opened.`);});document.body.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const {action,page:p,id,value,filter,field}=target.dataset;if(action==='navigate')navigate(p);if(action==='simulate')addOrder();if(action==='order-status')updateOrder(id,value);if(action==='shop-status')updateShop(id,value);if(action==='shop-toggle')toggleSetting(field);if(action==='save-settings')saveSettings();if(action==='save-profile')saveProfile();if(action==='open-item')openItem(id);if(action==='menu-toggle')toggleMenu(id);if(action==='reset-demo')resetDemo();if(action==='order-filter'){orderFilter=filter;renderKeepFocus('search-orders');}if(action==='shop-filter'){shopFilter=filter;renderKeepFocus('search-shops');}if(action==='menu-filter'){menuFilter=filter;renderKeepFocus('search-menu');}});document.body.addEventListener('input',e=>{const lookup={'search-orders':'orders','search-shops':'shops','search-menu':'menu'};if(!lookup[e.target.id])return;const start=e.target.selectionStart??0;search=e.target.value;render();const input=$(e.target.id);if(input){input.focus();input.setSelectionRange(start,start);}});$('close-modal').addEventListener('click',closeModal);$('cancel-modal').addEventListener('click',closeModal);$('modal-backdrop').addEventListener('click',e=>{if(e.target===$('modal-backdrop'))closeModal();});$('item-form').addEventListener('submit',submitItem);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal-backdrop').hidden)closeModal();});}
  function renderKeepFocus(id){render();}
  bind();render();
})();

</script>
</body>
